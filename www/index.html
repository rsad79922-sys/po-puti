<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141b3b">
  <meta name="description" content="По пути — находите попутчиков для междугородних поездок по России">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=mobile7">
  <title>По пути — едем вместе</title>
</head>
<body>
  <div id="app"><main style="padding:28px 20px;font-family:system-ui,-apple-system,sans-serif;color:#141b3b"><h1 style="font-size:24px">По пути</h1><p>Загружаем приложение…</p></main></div>
  <script>
    (function(){
      var failure=false;
      window.poPutiLoadError=function(message){
        failure=true;
        var root=document.getElementById('app');
        if(root) root.innerHTML='<main style="padding:28px 20px;font-family:system-ui,-apple-system,sans-serif;color:#141b3b"><h2>Не удалось открыть «По пути»</h2><p>'+String(message||'Ошибка загрузки страницы').replace(/[<>&]/g,'')+'</p><p><a href="/?refresh=mobile7" style="color:#087d77">Повторить загрузку</a></p></main>';
      };
      window.addEventListener('error',function(event){
        if(!event || !event.filename) return;
        var line=event.lineno || '?';
        window.poPutiLoadError('Ошибка выполнения JavaScript (строка '+line+'). Попробуйте обновить страницу.');
      });
      /* Starts immediately: Safari's load event may never fire if a resource stalls. */
      setTimeout(function(){
        var root=document.getElementById('app');
        if(!failure && root && root.textContent.indexOf('Загружаем приложение')!==-1){
          var scripts=document.querySelectorAll('script[src]');
          var loaded=[];
          for(var i=0;i<scripts.length;i++){
            loaded.push(scripts[i].src.split('/').pop()+': '+(scripts[i].dataset.status||'ожидание'));
          }
          window.poPutiLoadError('Приложение не запустилось. Проверка: '+loaded.join('; '));
        }
      },7000);
    })();
  </script>
  <script src="./config.js?v=mobile7" onload="this.dataset.status='загружен'" onerror="this.dataset.status='ошибка';window.poPutiLoadError('Не удалось загрузить настройки приложения')"></script>
  <script src="./app.js?v=mobile7" defer onload="this.dataset.status='загружен'" onerror="window.poPutiLoadError&&window.poPutiLoadError('Не удалось загрузить файл приложения. Проверьте подключение и обновите страницу.')"></script>
</body>
</html>
