<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141b3b">
  <meta name="description" content="По пути — совместные междугородние поездки">
  <title>По пути — едем вместе</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb;color:#141b3b;font-family:system-ui,-apple-system,Arial,sans-serif}
    #app{min-height:70vh}
    #startup{padding:24px 20px;font-size:16px}
    #startup h1{font-size:26px}
    #startup a{color:#087d77}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="startup" role="status" aria-live="polite">
    <h1>По пути</h1>
    <p id="startup-message">Открываем приложение…</p>
  </div>
  <script>
  (function(){
    var message=document.getElementById('startup-message');
    var box=document.getElementById('startup');
    var root=document.getElementById('app');
    var finished=false;
    function status(text){message.textContent=text;}
    function fail(text){
      if(finished)return;
      status(text);
      var a=document.createElement('a');
      a.href='/mobile-check.html';
      a.textContent='Проверить подключение';
      box.appendChild(a);
    }
    function completed(){
      if(root.children.length){
        finished=true;
        box.style.display='none';
        var css=document.createElement('link');
        css.rel='stylesheet';
        css.href='/styles.css?v=mobile9';
        css.onerror=function(){box.style.display='block';status('Интерфейс открыт, но оформление пока недоступно.')};
        document.head.appendChild(css);
        var manifest=document.createElement('link');
        manifest.rel='manifest';manifest.href='/manifest.webmanifest';
        document.head.appendChild(manifest);
      }else fail('Приложение не нарисовало интерфейс.');
    }
    window.addEventListener('error',function(e){
      if(!finished && e && e.message) fail('Ошибка запуска JavaScript (строка '+(e.lineno||'?')+'): '+String(e.message).slice(0,160));
    });
    window.addEventListener('unhandledrejection',function(e){
      if(!finished)fail('Ошибка запуска: '+String(e.reason||'неизвестная причина').slice(0,160));
    });
    function loadApp(){
      status('Запускаем экран входа…');
      var script=document.createElement('script');
      script.src='/app.js?v=mobile9';
      script.onload=completed;
      script.onerror=function(){fail('Файл приложения не загрузился.')};
      document.body.appendChild(script);
    }
    /* Same dynamic-load sequence that successfully rendered the login on iPhone. */
    function loadConfig(){
      status('Получаем настройки…');
      var script=document.createElement('script');
      script.src='/config.js?v=mobile9';
      script.onload=loadApp;
      script.onerror=function(){fail('Настройки приложения недоступны.')};
      document.body.appendChild(script);
    }
    setTimeout(function(){if(!finished)fail('Загрузка длится слишком долго.');},12000);
    setTimeout(loadConfig,50);
  })();
  </script>
</body>
</html>
