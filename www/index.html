<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141b3b">
  <meta name="description" content="По пути — совместные междугородние поездки">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>По пути — едем вместе</title>
  <link rel="stylesheet" href="/styles.css?v=boot13">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb;color:#141b3b;font-family:-apple-system,system-ui,Arial,sans-serif;line-height:1.5}
    #app{min-height:0}
    #boot{max-width:480px;padding:28px 20px;margin:0 auto}
    #boot h1{font-size:28px;margin:0 0 12px}
    #boot p{margin:0 0 16px;overflow-wrap:anywhere}
    #boot button{background:#141b3b;color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;cursor:pointer}
    #boot a{color:#087d77}
  </style>
</head>
<body>
  <div id="app"></div>
  <main id="boot" role="status" aria-live="polite">
    <h1>По пути</h1>
    <p id="boot-message">Открываем приложение…</p>
    <button type="button" id="boot-retry" style="display:none">Повторить загрузку</button>
  </main>
  <noscript>Для работы приложения «По пути» необходимо включить JavaScript.</noscript>
  <script>
  (function(){
    var root=document.getElementById('app');
    var boot=document.getElementById('boot');
    var notice=document.getElementById('boot-message');
    var retry=document.getElementById('boot-retry');
    var done=false,started=false;
    function status(text){notice.textContent=text;}
    function fail(text){
      if(done)return;
      status(text);
      retry.style.display='inline-block';
    }
    retry.addEventListener('click',function(){
      var url=new URL(window.location.href);
      url.searchParams.set('reload',String(Date.now()));
      window.location.assign(url.toString());
    });
    window.addEventListener('error',function(event){
      if(!done && event && event.message)fail('Ошибка запуска: '+String(event.message).slice(0,180)+' (строка '+(event.lineno||'?')+')');
    });
    window.addEventListener('unhandledrejection',function(event){
      if(!done)fail('Ошибка загрузки: '+String(event.reason||'неизвестная ошибка').slice(0,180));
    });
    function ready(){
      if(!root.querySelector('.shell')){
        fail('JavaScript загрузился, но не создал интерфейс.');
        return;
      }
      done=true;
      boot.remove();

    }
    function loadApp(){
      status('Запускаем приложение…');
      var script=document.createElement('script');
      script.src='/app.js?v=boot15';
      script.onload=ready;
      script.onerror=function(){fail('Не удалось загрузить app.js. Проверьте подключение.')};
      document.body.appendChild(script);
    }
    function start(){
      if(started)return;
      started=true;
      // Production PWA uses a same-origin API. An extra config.js request is
      // unnecessary and has failed intermittently in iPhone Safari.
      if((window.location.hostname==='vputipoputka.ru'||window.location.protocol==='https:')&&!window.Capacitor&&new URLSearchParams(location.search).get('demo')!=='1'){
        window.PO_PUTI_BACKEND=true;
        window.PO_PUTI_API_BASE='';
        loadApp();
        return;
      }
      // Standalone Android / local preview retain their existing config.js.
      status('Загружаем настройки…');
      var config=document.createElement('script');
      config.src='/config.js?v=boot12';
      config.onload=loadApp;
      config.onerror=function(){
        if(navigator.serviceWorker&&navigator.serviceWorker.controller){
          window.PO_PUTI_BACKEND=true;window.PO_PUTI_API_BASE='';loadApp();
        }else fail('Не удалось загрузить config.js. Проверьте подключение.');
      };
      document.body.appendChild(config);
    }
    /* Do not block navigation on CSS, manifest or a service worker. */
    setTimeout(start,60);
    setTimeout(function(){if(!done)fail('Загрузка длится слишком долго. Нажмите «Повторить загрузку».');},20000);
    if('serviceWorker' in navigator && !window.Capacitor && location.protocol==='https:'){
      navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'})
        .then(function(reg){return reg.update()}).catch(function(){});
    }
  })();
  </script>
</body>
</html>
