# Bootstrap only: no certificate is required. Enable the TLS template after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name vputipoputka.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    # Never accept credentials over cleartext HTTP during bootstrap.
    location / { return 503; }
}
