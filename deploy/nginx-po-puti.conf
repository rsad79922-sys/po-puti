# This file is included from nginx's http {} context via sites-enabled.
# Certbot adds TLS/443 and the HTTPS redirect after DNS is configured.
limit_req_zone $binary_remote_addr zone=poputi_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vputipoputka.ru;

    client_max_body_size 1m;

    location = /api/login {
        limit_req zone=poputi_auth burst=15 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
    }
    location = /api/register {
        limit_req zone=poputi_auth burst=15 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
