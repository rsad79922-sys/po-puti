# This file is included from nginx's http {} context via sites-enabled.
# Certbot adds TLS/443 and the HTTPS redirect after DNS is configured.
limit_req_zone $binary_remote_addr zone=poputi_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vputipoputka.ru;

    client_max_body_size 1m;

    location = /api/login {
        limit_req zone=poputi_auth burst=15 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/register {
        limit_req zone=poputi_auth burst=15 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
}

# HTTPS example: merge with Certbot-managed certificate paths on the live host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vputipoputka.ru;
    ssl_certificate /etc/letsencrypt/live/vputipoputka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vputipoputka.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
