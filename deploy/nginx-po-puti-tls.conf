# Ubuntu 24.04 nginx 1.24 compatible; replaces the bootstrap site, not a second site.
map $uri $poputi_auth_key {
    default "";
    /api/login $binary_remote_addr;
    /api/register $binary_remote_addr;
}
limit_req_zone $poputi_auth_key zone=poputi_auth:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name vputipoputka.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://vputipoputka.ru$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vputipoputka.ru;
    ssl_certificate /etc/letsencrypt/live/vputipoputka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vputipoputka.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:poputi_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req zone=poputi_auth burst=15 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/po-puti-access.log poputi;
    error_log /var/log/nginx/po-puti-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
