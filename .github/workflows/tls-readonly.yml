name: Read-only synchronized TLS diagnosis
on:
  push:
    branches: ['diagnostics/tls-20261114']
    paths: ['.github/workflows/tls-readonly.yml']
permissions:
  contents: read
concurrency:
  group: po-puti-tls-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read server state while probing TLS from independent network
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/tls-diagnosis.key"
          hosts_file="$RUNNER_TEMP/tls-diagnosis.hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          cat > "$RUNNER_TEMP/server-readonly.sh" <<'REMOTE'
          set -u
          probe_ip="$1"
          [[ "$probe_ip" =~ ^[0-9.]+$ ]] || exit 2
          date -u
          systemctl is-active po-puti nginx
          ss -ltnp '( sport = :443 )'
          ip -d link show eth0
          sysctl net.ipv4.tcp_mtu_probing net.ipv4.tcp_base_mss
          nginx -T 2>&1 | awk '/^[[:space:]]*(listen|server_name|ssl_protocols|ssl_ciphers|ssl_ecdh_curve|ssl_conf_command|ssl_handshake_timeout|ssl_buffer_size|ssl_session_cache|ssl_session_timeout|ssl_certificate|http2)[[:space:]]/{print}'
          openssl x509 -in /etc/letsencrypt/live/vputipoputka.ru/fullchain.pem -noout -subject -issuer -dates -fingerprint -sha256
          for target in 'http://127.0.0.1:8080/api/health' 'https://vputipoputka.ru/api/health'; do
            curl --noproxy '*' -sS --resolve vputipoputka.ru:443:127.0.0.1 --connect-timeout 3 --max-time 5 -o /dev/null -w 'LOCAL http=%{http_code} tls=%{time_appconnect} total=%{time_total}\n' "$target" || true
          done
          capture=$(mktemp /tmp/po-puti-tls-readonly-XXXXXX)
          cap_pid=''
          cleanup(){ if [ -n "$cap_pid" ]; then kill "$cap_pid" 2>/dev/null || true; fi; rm -f "$capture"; }
          trap cleanup EXIT
          timeout 165 tcpdump -nn -tttt -l -i eth0 -s 96 "tcp port 443 and host $probe_ip" > "$capture" 2>&1 &
          cap_pid=$!
          echo CAPTURE_READY
          wait "$cap_pid" || true
          sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g' "$capture" | tail -n 1000
          tail -n 35 /var/log/nginx/po-puti-tls.log | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'
          awk '/probe=gh-tls-readonly/{print}' /var/log/nginx/access.log | tail -n 30 | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'
          REMOTE
          ssh -i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=12 "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n bash -s -- "${SSH_CONNECTION%% *}"' < "$RUNNER_TEMP/server-readonly.sh" > "$RUNNER_TEMP/remote.txt" 2>&1 &
          remote_pid=$!
          for attempt in {1..20}; do
            if grep -q CAPTURE_READY "$RUNNER_TEMP/remote.txt"; then break; fi
            if ! kill -0 "$remote_pid" 2>/dev/null; then cat "$RUNNER_TEMP/remote.txt"; exit 1; fi
            sleep 1
          done
          grep -q CAPTURE_READY "$RUNNER_TEMP/remote.txt"
          for round in 1 2 3 4 5 6; do
            for tls in 1.2 1.3; do
              date -u
              curl --noproxy '*' --http1.1 --tlsv"$tls" --tls-max "$tls" --resolve vputipoputka.ru:443:130.49.129.99 --connect-timeout 6 --max-time 10 -sS -o /dev/null -w "PROBE round=$round tls=$tls http=%{http_code} verify=%{ssl_verify_result} connect=%{time_connect} handshake=%{time_appconnect} total=%{time_total}\n" "https://vputipoputka.ru/api/health?probe=gh-tls-readonly-$round-$tls" || true
            done
            if [ "$round" -lt 6 ]; then sleep 3; fi
          done
          cat > "$RUNNER_TEMP/padded.py" <<'PADDED'
          """Read-only first-flight TLS probe; sends no HTTP or account credentials."""
          import socket
          import ssl
          import struct
          import time
          
          HOST = 'vputipoputka.ru'
          IP = '130.49.129.99'
          
          
          def client_hello(size, version):
              ctx = ssl.create_default_context()
              ctx.set_ecdh_curve('X25519')
              ctx.minimum_version = version
              ctx.maximum_version = version
              incoming, outgoing = ssl.MemoryBIO(), ssl.MemoryBIO()
              conn = ctx.wrap_bio(incoming, outgoing, server_side=False, server_hostname=HOST)
              try:
                  conn.do_handshake()
              except ssl.SSLWantReadError:
                  pass
              record = outgoing.read()
              assert record[0] == 22 and record[5] == 1
              assert len(record) == 5 + int.from_bytes(record[3:5], 'big')
              body = record[9:]
              pos = 34
              pos += 1 + body[pos]  # session ID
              pos += 2 + int.from_bytes(body[pos:pos+2], 'big')  # cipher suites
              pos += 1 + body[pos]  # compression
              extpos = pos
              end = pos + 2 + int.from_bytes(body[pos:pos+2], 'big')
              assert end == len(body)
              pos += 2
              extensions = []
              while pos < end:
                  kind, length = struct.unpack('!HH', body[pos:pos+4])
                  if kind != 21:  # replace padding instead of duplicating it
                      extensions.append(body[pos:pos+4+length])
                  pos += 4 + length
              assert pos == end
              extensions = b''.join(extensions)
              padding = size - (5 + 4 + extpos + 2 + len(extensions) + 4)
              assert 0 <= padding <= 16384
              extensions += struct.pack('!HH', 21, padding) + bytes(padding)
              body = body[:extpos] + struct.pack('!H', len(extensions)) + extensions
              handshake = b'\x01' + len(body).to_bytes(3, 'big') + body
              result = record[:3] + struct.pack('!H', len(handshake)) + handshake
              assert len(result) == size
              return result
          
          
          def main():
              for version in (ssl.TLSVersion.TLSv1_2, ssl.TLSVersion.TLSv1_3):
                  for size in (512, 1200, 1535, 3000):
                      started = time.monotonic()
                      try:
                          payload = client_hello(size, version)
                          with socket.create_connection((IP, 443), timeout=5) as sock:
                              sock.settimeout(5)
                              sock.sendall(payload)
                              header = sock.recv(5)
                              record_type = header[0] if header else 'EOF'
                              print(f'PADDED version={version.name} bytes={size} response_type={record_type} elapsed={time.monotonic()-started:.3f}', flush=True)
                      except Exception as exc:
                          print(f'PADDED version={version.name} bytes={size} error={type(exc).__name__} elapsed={time.monotonic()-started:.3f}', flush=True)
          
          
          if __name__ == '__main__':
              main()
          PADDED
          python3 "$RUNNER_TEMP/padded.py"
          wait "$remote_pid"
          cat "$RUNNER_TEMP/remote.txt"
