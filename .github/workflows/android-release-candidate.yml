name: Unsigned Android release candidate (no store upload)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'New versionCode greater than the existing RuStore version'
        required: true
        type: string
      previous_version_code:
        description: 'Existing published/moderation versionCode'
        required: true
        type: string
      version_name:
        description: 'Release version name'
        required: true
        default: '0.3.0'
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  android:
    uses: ./.github/workflows/android-build.yml
    secrets:
      RUSTORE_PUSH_PROJECT_ID: ${{ secrets.RUSTORE_PUSH_PROJECT_ID }}
  candidate:
    needs: [verify, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate a reproducible unsigned release only
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          RUSTORE_PUSH_PROJECT_ID: ${{ secrets.RUSTORE_PUSH_PROJECT_ID }}
        run: |
          node -e 'const a=Number(process.env.ANDROID_VERSION_CODE),b=Number(process.env.ANDROID_PREVIOUS_VERSION_CODE);if(!Number.isInteger(a)||!Number.isInteger(b)||b<1||a<=b)process.exit(1)'
          npm ci --ignore-scripts
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: po-puti-UNSIGNED-not-for-installation
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
