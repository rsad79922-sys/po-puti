name: Signed Android APK for direct download (no RuStore upload)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Direct APK versionCode, at least 4; RuStore 1.0.0 (3) is untouched'
        required: true
        default: '4'
        type: string
      version_name:
        description: 'Direct APK versionName'
        required: true
        default: '1.0.1'
        type: string
      publish_download:
        description: 'After both Android tests, publish APK on the existing site and enable its download banner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: po-puti-android-direct-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release-apk:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate the separate direct-release version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e 'const n=Number(process.env.ANDROID_VERSION_CODE);if(!Number.isInteger(n)||n<4||n>999999999||!/^\d+(?:\.\d+){1,3}$/.test(process.env.ANDROID_VERSION_NAME))process.exit(1)'
      - name: Generate release and a separate instrumentation APK without signing secrets
        env:
          RUSTORE_PUSH_PROJECT_ID: ${{ secrets.RUSTORE_PUSH_PROJECT_ID }}
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx cap add android
          node scripts/prepare-android.mjs
          node scripts/prepare-direct-android-tests.mjs
          if [ -n "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
          fi
          npx cap sync android
          cd android
          ./gradlew assembleRelease assembleReleaseAndroidTest :app:testReleaseUnitTest --no-daemon
      - name: Check the non-debuggable release manifest and identical PWA assets
        run: |
          python3 tests/native-android/verify_manifest.py release
          python3 tests/native-android/verify_assets.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Align release binaries for Android native-library page sizes
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0' > /dev/null
          mkdir -p out
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/release-aligned.apk
          mapfile -t instrument_apks < <(find android/app/build/outputs/apk/androidTest/release -maxdepth 1 -type f -name '*.apk')
          test "${#instrument_apks[@]}" -eq 1
          "$tools/zipalign" -P 16 -f 4 "${instrument_apks[0]}" out/test-aligned.apk
      - name: Sign on the VPS with its permanent private keystore
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: bash deploy/android-direct-release.sh sign
      - name: Verify signature, identity, version and exact received bytes
        run: |
          set -euo pipefail
          export AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          node scripts/check-signed-android.mjs out/po-puti-release.apk out/release-info.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/signed-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -c 4 out/po-puti-release.apk
          python3 tests/native-android/verify_assets.py out/po-puti-release.apk
      - name: Wait for the tested main backend to finish its normal code deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://vputipoputka.ru/api/health -o "$RUNNER_TEMP/backend-health.json" && node -e 'const h=require(process.argv[1]);if(!h.ok||h.release!==process.env.GITHUB_SHA)process.exit(1)' "$RUNNER_TEMP/backend-health.json"; then
              sleep 10
              curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://vputipoputka.ru/api/health -o "$RUNNER_TEMP/backend-health.json"
              node -e 'const h=require(process.argv[1]);if(!h.ok||h.release!==process.env.GITHUB_SHA)process.exit(1)' "$RUNNER_TEMP/backend-health.json"
              exit 0
            fi
            sleep 15
          done
          echo 'Expected verified backend revision is not available.' >&2
          exit 1
      - name: Enable KVM on this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the signed release and test launch, login and native search on Android 15
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install --no-streaming -r out/po-puti-release.apk
            adb install --no-streaming -r -t out/signed-test.apk
            adb shell am instrument -w -r -e class ru.poputi.app.SignedReleaseFlowTest -e expectedVersionCode "$ANDROID_VERSION_CODE" ru.poputi.app.test/androidx.test.runner.AndroidJUnitRunner > out/android-15-test.txt
            node scripts/check-android-instrumentation.mjs out/android-15-test.txt
      - name: Install the same signed release on Android 11 without GMS
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python3 -c 'import subprocess; assert "package:" not in subprocess.check_output(["adb","shell","pm","list","packages","com.google.android.gms"]).decode()'
            adb install --no-streaming -r out/po-puti-release.apk
            adb install --no-streaming -r -t out/signed-test.apk
            adb shell am instrument -w -r -e class ru.poputi.app.SignedReleaseFlowTest -e expectedVersionCode "$ANDROID_VERSION_CODE" ru.poputi.app.test/androidx.test.runner.AndroidJUnitRunner > out/android-11-test.txt
            node scripts/check-android-instrumentation.mjs out/android-11-test.txt
      - name: Save instrumentation results without credentials or user records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: po-puti-direct-android-tests
          path: out/android-*-test.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload only the tested signed APK and public metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: po-puti-signed-release
          path: |
            out/po-puti-release.apk
            out/release-info.json
            out/certificate.pem
            out/SHA256SUMS
            out/android-15-test.txt
            out/android-11-test.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish the tested direct APK without any RuStore operation
        if: inputs.publish_download
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: bash deploy/android-direct-release.sh publish
      - name: Verify the published file over public HTTPS
        if: inputs.publish_download
        run: |
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 120 https://vputipoputka.ru/downloads/po-puti.apk -o "$RUNNER_TEMP/public-po-puti.apk"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const m=JSON.parse(fs.readFileSync("out/release-info.json"));if(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex")!==m.apkSHA256)process.exit(1);console.log("PUBLIC_SIGNED_APK_SHA256_OK")' "$RUNNER_TEMP/public-po-puti.apk"
