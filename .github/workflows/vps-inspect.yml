name: Read-only publication preflight
on:
  push:
    branches: [ops/reinstall-publication-20261114]
    paths: ['deploy/inspect-vps.sh', 'deploy/prepare-ssh.sh', 'deploy/ssh-host-fingerprint.txt', '.github/workflows/vps-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: po-puti-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inspect deployment prerequisites without changing the server
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir="$RUNNER_TEMP/publication-ssh"
          trap 'rm -rf "$ssh_dir"' EXIT
          bash deploy/prepare-ssh.sh "$ssh_dir"
          key_file="$ssh_dir/key"
          hosts_file="$ssh_dir/known_hosts"
          port="${DEPLOY_PORT:-22}"
          ssh -i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=12 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n bash -s' < deploy/inspect-vps.sh
