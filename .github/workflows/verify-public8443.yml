name: Verify public alternate HTTPS browser startup
on:
  push:
    branches: ['diagnostics/tls-20261114']
    paths: ['.github/workflows/verify-public8443.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright@1.65.0
      - name: Check mobile viewport, reload and installed Service Worker without account writes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {existsSync,writeFileSync} from 'node:fs';
          const executable=['/usr/bin/google-chrome','/usr/bin/chromium','/opt/google/chrome/chrome'].find(existsSync);
          assert(executable,'Runner Chrome executable not found');
          const browser=await chromium.launch({executablePath:executable,headless:true,args:['--no-sandbox']});
          const errors=[];
          try{
            const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});
            const page=await context.newPage();page.setDefaultTimeout(20000);
            page.on('pageerror',error=>errors.push(error.message));
            for(let attempt=1;attempt<=3;attempt++){
              const response=await page.goto('https://vputipoputka.ru:8443/?verify=browser'+attempt,{waitUntil:'domcontentloaded',timeout:25000});
              assert.equal(response.status(),200);
              await page.locator('#login-form').waitFor();
              await page.waitForFunction(()=>!document.querySelector('#boot'));
              assert.equal(await page.locator('.shell').count(),1);
              assert.deepEqual(errors,[]);
              console.log('BROWSER_LOGIN_OK attempt='+attempt);
            }
            const health=await page.evaluate(async()=>{const response=await fetch('/api/health',{cache:'no-store'});return {status:response.status,body:await response.json()};});
            assert.equal(health.status,200);assert.equal(health.body.ok,true);
            await page.evaluate(async()=>{const registration=await navigator.serviceWorker.ready;return registration.active?.state});
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('#login-form').waitFor();
            assert.deepEqual(errors,[]);
            console.log('BROWSER_SERVICE_WORKER_REOPEN_OK');
            writeFileSync('public-browser-result.txt','PASS: public login UI, repeated navigation, API health and Service Worker reopen on HTTPS 8443; no accounts created.\n');
          }finally{await browser.close()}
          NODE

