name: Independent TLS handshake evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
jobs:
  tls-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Repeated TCP TLS and HTTP observations
        shell: bash
        run: |
          set -uo pipefail
          log=tls-evidence.log
          : > "$log"
          failures=0
          pinned_ip=$(getent ahostsv4 vputipoputka.ru | awk '$2 == "STREAM" {print $1; exit}')
          if [[ -z "$pinned_ip" ]]; then echo 'DNS lookup failed' | tee -a "$log"; exit 1; fi
          echo "PINNED_IPV4=$pinned_ip" | tee -a "$log"
          echo "START_UTC=$(date -u +%FT%TZ)" | tee -a "$log"
          for round in 1 2 3; do
            for version in 1.2 1.3; do
              for mode in dns pinned; do
                args=()
                if [[ "$mode" == pinned ]]; then
                  args=(--resolve "vputipoputka.ru:443:$pinned_ip")
                fi
                body=$(mktemp)
                echo "CHECK utc=$(date -u +%FT%TZ) round=$round tls=$version mode=$mode" | tee -a "$log"
                if curl --noproxy '*' -4 -sS --fail --connect-timeout 5 --max-time 14 \
                  --tlsv"$version" --tls-max "$version" "${args[@]}" \
                  -H 'Cache-Control: no-cache' \
                  -o "$body" -w 'HTTP=%{http_code} TCP=%{time_connect} TLS=%{time_appconnect} TOTAL=%{time_total} CERT=%{ssl_verify_result}\n' \
                  https://vputipoputka.ru/api/health 2>&1 | tee -a "$log" \
                  && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body"; then
                  echo "PASS round=$round tls=$version mode=$mode" | tee -a "$log"
                else
                  echo "FAIL round=$round tls=$version mode=$mode" | tee -a "$log"
                  failures=$((failures+1))
                fi
                rm -f "$body"
              done
            done
            sleep 3
          done
          echo "RESULT failures=$failures of 12; no TLS root-cause inference" | tee -a "$log"
          exit "$((failures > 0))"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-evidence
          path: tls-evidence.log
          if-no-files-found: warn
          retention-days: 14
