name: Deploy Po Puti (verified commit, backup, rollback)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type publish-vputipoputka.ru to confirm manual deployment'
        required: true
        type: string

      initial_install:
        description: 'Initial installation on a reinstalled Ubuntu server; existing application checkout is refused'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: po-puti-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.POPUTI_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'publish-vputipoputka.ru'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Refuse deployment when required SSH credentials are unavailable
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          echo 'Required deployment credentials supplied by GitHub secrets.'
      - name: SSH publish pinned main commit (fail closed)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
          INITIAL_INSTALL: ${{ inputs.initial_install }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir="$RUNNER_TEMP/publication-ssh"
          trap 'rm -rf "$ssh_dir"' EXIT
          bash deploy/prepare-ssh.sh "$ssh_dir"
          if [ -z "$DEPLOY_PORT" ]; then DEPLOY_PORT=22; fi
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          release_script=deploy/release-on-vps.sh
          if [[ "$INITIAL_INSTALL" = true ]]; then release_script=deploy/bootstrap-vps.sh; fi
          remote_command="sudo -n bash -s -- $GITHUB_SHA"
          if [[ "$DEPLOY_USER" = root ]]; then remote_command="bash -s -- $GITHUB_SHA"; fi
          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=12 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" < "$release_script"
      - name: Verify public production assets from external GitHub runner
        run: |
          set -euo pipefail
          for resource in / /app.js /styles.css /api/health; do
            curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 12 \
              -o /dev/null "https://vputipoputka.ru$resource"
          done
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 12 \
            https://vputipoputka.ru/api/health > "$RUNNER_TEMP/health.json"
          node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync(process.argv[1]));if(!h.ok||h.release!==process.env.GITHUB_SHA)process.exit(1)' "$RUNNER_TEMP/health.json"
          echo 'Public site and exact verified release respond from external GitHub runner.'
