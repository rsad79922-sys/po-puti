name: Publish Po Puti (manual, verified backup, rollback)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type publish-vputipoputka.ru to confirm manual deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: po-puti-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-vputipoputka.ru'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release script and isolated SQLite restore test
        run: |
          bash -n deploy/release-on-vps.sh
          node tests/sqlite-backup.mjs
      - name: Refuse deployment when required SSH credentials are unavailable
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          echo 'Required deployment credentials supplied by GitHub secrets.'
      - name: SSH publish pinned main commit (fail closed)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/po-puti-ssh.key"
          chmod 0600 "$RUNNER_TEMP/po-puti-ssh.key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/po-puti-known-hosts"
          chmod 0600 "$RUNNER_TEMP/po-puti-known-hosts"
          if [ -z "$DEPLOY_PORT" ]; then DEPLOY_PORT=22; fi
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          ssh -i "$RUNNER_TEMP/po-puti-ssh.key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/po-puti-known-hosts" \
            -o ConnectTimeout=12 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n bash -s -- $GITHUB_SHA" < deploy/release-on-vps.sh
      - name: Verify public production assets from external GitHub runner
        run: |
          set -euo pipefail
          for resource in / /app.js /styles.css /api/health; do
            curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 12 \
              -o /dev/null "https://vputipoputka.ru$resource"
          done
          echo 'Public site and API respond from independent GitHub runner.'
