name: Android PWA shared-backend build
on:
  pull_request:
    branches: [main]
    paths: [www/**, server/**, capacitor.config.json, package.json, .github/workflows/android-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor 7 dependencies
        run: npm install --no-audit --no-fund
      - name: Check native API integration
        run: node tests/native-config.mjs
      - name: Generate the native Android wrapper and synchronize shared web app
        run: |
          npx cap add android
          npx cap sync android
          test -e android/app/src/main/assets/public/config.js
          grep -Fq "https://vputipoputka.ru" android/app/src/main/assets/public/config.js
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Save Android test artifact (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: po-puti-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
