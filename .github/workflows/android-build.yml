name: Android PWA shared-backend build
on:
  pull_request:
    branches: [main]
    paths: [www/**, server/**, tests/native-android/**, native/**, scripts/prepare-android.mjs, capacitor.config.json, package.json, package-lock.json, .github/workflows/android-build.yml]
  workflow_dispatch:
  workflow_call:
    secrets:
      FIREBASE_ANDROID_CONFIG_JSON:
        required: false
      RUSTORE_PUSH_PROJECT_ID:
        required: false
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor 7 dependencies
        run: npm ci --ignore-scripts
      - name: Check native API integration
        run: node tests/native-config.mjs
      - name: Generate the native Android wrapper and synchronize shared web app
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
          RUSTORE_PUSH_PROJECT_ID: ${{ secrets.RUSTORE_PUSH_PROJECT_ID }}
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          if [ -n "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
          fi
          install -D -m 0644 tests/native-android/LauncherIconAssertions.java android/app/src/androidTest/java/ru/poputi/app/LauncherIconAssertions.java
          install -D -m 0644 tests/native-android/SharedUiSmokeTest.java android/app/src/androidTest/java/ru/poputi/app/SharedUiSmokeTest.java
          install -D -m 0644 tests/native-android/UpdatePromptTest.java android/app/src/androidTest/java/ru/poputi/app/UpdatePromptTest.java
          install -D -m 0644 tests/native-android/PushPolicyTest.java android/app/src/test/java/ru/poputi/app/PushPolicyTest.java
          install -D -m 0644 tests/native-android/SearchDateTest.java android/app/src/test/java/ru/poputi/app/SearchDateTest.java
          install -D -m 0644 tests/native-android/UpdatePolicyTest.java android/app/src/test/java/ru/poputi/app/UpdatePolicyTest.java
          npx cap sync android
          test -e android/app/src/main/assets/public/config.js
          grep -Fq "https://vputipoputka.ru" android/app/src/main/assets/public/config.js
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Build unsigned release configuration (no signing or store upload)
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Inspect merged permissions, privacy and release configuration
        run: |
          python3 tests/native-android/verify_manifest.py debug
          python3 tests/native-android/verify_manifest.py release
      - name: Verify byte-identical PWA assets inside the compiled APK
        run: python3 tests/native-android/verify_assets.py
      - name: Enable KVM for the disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch actual APK and validate packaged UI and native bridge
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/native-android/run-ui-checks.sh android15
      - name: Save emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-test-reports
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Clear disposable emulator reports before the AOSP run
        run: rm -rf android/app/build/reports/androidTests/connected android/app/build/outputs/androidTest-results/connected
      - name: Launch the same APK on AOSP without Google services
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python3 -c 'import subprocess; packages=subprocess.check_output(["adb","shell","pm","list","packages","com.google.android.gms"]).decode(); assert "package:" not in packages, "Expected an AOSP device without GMS"'
            bash tests/native-android/run-ui-checks.sh android11
      - name: Save AOSP startup and bridge test reports (not live push evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-aosp-test-reports
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save small-screen Android search screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-search-screenshots
          path: out/search-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Android test artifact (not a signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
