name: Android PWA shared-backend build
on:
  pull_request:
    branches: [main]
    paths: [www/**, server/**, tests/native-android/**, capacitor.config.json, package.json, package-lock.json, .github/workflows/android-build.yml]
  workflow_dispatch:
  workflow_call:
    secrets:
      FIREBASE_ANDROID_CONFIG_JSON:
        required: false
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor 7 dependencies
        run: npm ci --ignore-scripts
      - name: Check native API integration
        run: node tests/native-config.mjs
      - name: Generate the native Android wrapper and synchronize shared web app
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          npx cap add android
          if [ -n "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
          fi
          install -D -m 0644 tests/native-android/SharedUiSmokeTest.java android/app/src/androidTest/java/ru/poputi/app/SharedUiSmokeTest.java
          npx cap sync android
          test -e android/app/src/main/assets/public/config.js
          grep -Fq "https://vputipoputka.ru" android/app/src/main/assets/public/config.js
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Verify byte-identical PWA assets inside the compiled APK
        run: python3 tests/native-android/verify_assets.py
      - name: Enable KVM for the disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch actual APK and validate packaged UI and native bridge
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=ru.poputi.app.SharedUiSmokeTest
      - name: Save emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-test-reports
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Android test artifact (not a signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
