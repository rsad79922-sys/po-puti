name: Android PWA shared-backend build
on:
  pull_request:
    branches: [main]
    paths: [www/**, server/**, capacitor.config.json, package.json, package-lock.json, .github/workflows/android-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor 7 dependencies
        run: npm ci --ignore-scripts
      - name: Check native API integration
        run: node tests/native-config.mjs
      - name: Generate the native Android wrapper and synchronize shared web app
        run: |
          npx cap add android
          npx cap sync android
          test -e android/app/src/main/assets/public/config.js
          grep -Fq "https://vputipoputka.ru" android/app/src/main/assets/public/config.js
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Save Android test artifact (not a signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: po-puti-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
