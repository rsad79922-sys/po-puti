name: Verify TLS delivery across transport segmentation layouts
on:
  push:
    branches: ['diagnostics/tls-20261114']
    paths: ['.github/workflows/tls-segmentation.yml']
permissions:
  contents: read
jobs:
  dual-capture:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 7
    steps:
      - name: Capture both sides and inspect guest packet-processing rules
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/dual-capture.key"
          hosts_file="$RUNNER_TEMP/dual-capture.hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          if ! command -v tcpdump >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y -qq tcpdump; fi
          cat > "$RUNNER_TEMP/server.sh" <<'REMOTE'
          set -u
          ip="$1"
          [[ "$ip" =~ ^[0-9.]+$ ]] || exit 2
          redact(){ sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'; }
          echo SERVER_STATE_START
          date -u
          timedatectl show -p NTPSynchronized
          uptime
          systemctl is-active nginx po-puti
          ss -ltnp '( sport = :443 or sport = :8443 )'
          python3 - <<'SUMMARY'
          import subprocess,json
          def output(args):
              try:return subprocess.run(args,capture_output=True,text=True,timeout=5).stdout
              except (OSError,subprocess.TimeoutExpired):return ''
          iptables=output(['iptables-save']);nft=output(['nft','-j','list','ruleset'])
          tc_in=output(['tc','filter','show','dev','eth0','ingress']);tc_out=output(['tc','filter','show','dev','eth0','egress'])
          interface=output(['ip','-j','-d','link','show','dev','eth0'])
          nft_tables=0;nft_rules=0;xdp_attached=None
          try:
              data=json.loads(nft)
              nft_tables=sum('table' in x for x in data.get('nftables',[]))
              nft_rules=sum('rule' in x for x in data.get('nftables',[]))
          except (ValueError,TypeError):pass
          try:
              data=json.loads(interface)[0]
              xdp_attached=bool(data.get('xdp',{}).get('attached') not in (None,False,'off'))
          except (ValueError,TypeError,IndexError):pass
          rules=[line for line in iptables.splitlines() if line.startswith('-A ')]
          summary={'iptables_rule_count':len(rules),'nft_table_count':nft_tables,'nft_rule_count':nft_rules,'tc_ingress_classifier_present':bool(tc_in.strip()),'tc_egress_classifier_present':bool(tc_out.strip()),'xdp_attached':xdp_attached}
          for field in ('rx_dropped','tx_dropped','rx_errors','tx_errors'):
              try:summary[field]=int(open('/sys/class/net/eth0/statistics/'+field).read())
              except OSError:pass
          print('GUEST_PACKET_PROCESSING_SUMMARY '+json.dumps(summary,sort_keys=True))
          SUMMARY
          echo SERVER_STATE_END
          capture=$(mktemp /tmp/po-puti-dual-XXXXXX)
          trap 'rm -f "$capture"' EXIT
          echo SERVER_CAPTURE_START
          timeout 100 tcpdump -nn -tttt -l -i eth0 -s 96 "host $ip and (tcp port 443 or tcp port 8443)" > "$capture" 2>&1 &
          pid=$!
          echo CAPTURE_READY
          wait "$pid" || true
          redact < "$capture" | tail -n 800
          echo SERVER_CAPTURE_END
          curl --noproxy '*' --resolve vputipoputka.ru:443:127.0.0.1 --max-time 5 -fsS -o /dev/null -w 'LOCAL443 http=%{http_code} certificate=%{ssl_verify_result}\n' https://vputipoputka.ru/api/health
          REMOTE
          ssh -i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=12 "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n bash -s -- "${SSH_CONNECTION%% *}"' < "$RUNNER_TEMP/server.sh" > "$RUNNER_TEMP/server.txt" 2>&1 &
          remote_pid=$!
          for attempt in {1..25}; do
            if grep -q CAPTURE_READY "$RUNNER_TEMP/server.txt"; then break; fi
            if ! kill -0 "$remote_pid" 2>/dev/null; then cat "$RUNNER_TEMP/server.txt"; exit 1; fi
            sleep 1
          done
          grep -q CAPTURE_READY "$RUNNER_TEMP/server.txt"
          sudo timeout 90 tcpdump -nn -tttt -l -i any -s 96 'host 130.49.129.99 and (tcp port 443 or tcp port 8443)' > "$RUNNER_TEMP/client.txt" 2>&1 &
          client_pid=$!
          sleep 1
          cat > "$RUNNER_TEMP/segmentation.py" <<'SEGMENTATION'
          """Compare standards-compliant TLS transport layouts on the owner's endpoints."""
          import json
          import socket
          import ssl
          import time
          
          IP = '130.49.129.99'
          HOST = 'vputipoputka.ru'
          
          
          def probe(port, mode, context=None):
              started = time.monotonic()
              context = context or ssl.create_default_context()
              context.minimum_version = ssl.TLSVersion.TLSv1_2
              context.maximum_version = ssl.TLSVersion.TLSv1_2
              raw = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              raw.settimeout(4)
              raw.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
              if mode == 'mss200':
                  raw.setsockopt(socket.IPPROTO_TCP, socket.TCP_MAXSEG, 200)
              incoming, outgoing = ssl.MemoryBIO(), ssl.MemoryBIO()
              tls = context.wrap_bio(incoming, outgoing, server_side=False, server_hostname=HOST)
              first = True
              first_bytes = 0
              deadline = started + 9
          
              def flush():
                  nonlocal first, first_bytes
                  while outgoing.pending:
                      data = outgoing.read()
                      if first:
                          first_bytes = len(data)
                          if mode == 'record-split':
                              assert data[0] == 22 and len(data) == 5 + int.from_bytes(data[3:5], 'big')
                              payload = data[5:]
                              chunks = [payload[:64], payload[64:]]
                              data = b''.join(data[:3] + len(c).to_bytes(2, 'big') + c for c in chunks)
                          if mode == 'byte-split':
                              raw.sendall(data[:1])
                              time.sleep(0.08)
                              raw.sendall(data[1:])
                          elif mode == 'chunks64':
                              for offset in range(0, len(data), 64):
                                  raw.sendall(data[offset:offset+64])
                                  time.sleep(0.03)
                          else:
                              raw.sendall(data)
                          first = False
                      else:
                          raw.sendall(data)
          
              def receive():
                  if time.monotonic() > deadline:
                      raise TimeoutError('probe deadline')
                  data = raw.recv(65536)
                  if not data:
                      raise EOFError('peer closed before HTTP response')
                  incoming.write(data)
          
              try:
                  raw.connect((IP, port))
                  mss = raw.getsockopt(socket.IPPROTO_TCP, socket.TCP_MAXSEG)
                  while True:
                      try:
                          tls.do_handshake()
                          flush()
                          break
                      except ssl.SSLWantReadError:
                          flush()
                          receive()
                  tls.write(b'GET /api/health?probe=segmentation HTTP/1.1\r\nHost: vputipoputka.ru\r\nConnection: close\r\n\r\n')
                  flush()
                  plaintext = b''
                  while b'"ok":true' not in plaintext and len(plaintext) < 65536:
                      try:
                          data = tls.read(65536)
                          if not data:
                              break
                          plaintext += data
                      except ssl.SSLWantReadError:
                          flush()
                          receive()
                  success = plaintext.startswith(b'HTTP/1.1 200 ') and b'"ok":true' in plaintext
                  return {'port':port, 'mode':mode, 'result':'HTTP200' if success else 'unexpected-http', 'first_bytes':first_bytes, 'mss':mss, 'elapsed':round(time.monotonic()-started,3)}
              except (OSError, ssl.SSLError, EOFError, AssertionError) as exc:
                  return {'port':port, 'mode':mode, 'result':type(exc).__name__, 'first_bytes':first_bytes, 'elapsed':round(time.monotonic()-started,3)}
              finally:
                  raw.close()
          
          
          if __name__ == '__main__':
              for mode in ('normal', 'byte-split', 'chunks64', 'record-split', 'mss200', 'normal'):
                  for port in (443, 8443):
                      print('SEGMENTATION ' + json.dumps(probe(port,mode)), flush=True)
          SEGMENTATION
          python3 "$RUNNER_TEMP/segmentation.py"
          wait "$client_pid" || true
          echo CLIENT_CAPTURE_START
          sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g' "$RUNNER_TEMP/client.txt" | tail -n 800
          echo CLIENT_CAPTURE_END
          wait "$remote_pid"
          cat "$RUNNER_TEMP/server.txt"
