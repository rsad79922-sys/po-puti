name: Mobile WebKit startup

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'server/**'
      - 'deploy/**'
      - 'tests/**'
      - '.github/workflows/mobile-webkit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'server/**'
      - 'deploy/**'
      - 'tests/**'
      - '.github/workflows/mobile-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tooling
        run: npm install --no-save --ignore-scripts playwright@1.65.0
      - name: Install WebKit with dependencies
        run: npx playwright install --with-deps webkit
      - name: Check JavaScript syntax
        run: |
          node --check www/app.js
          node --check www/sw.js
          node --check server/server.mjs
      - name: Audit source syntax, URLs, CSS and nginx punctuation
        run: node tests/source-audit.mjs
      - name: Validate browser bootstrap invariants
        run: node tests/pwa-bootstrap.mjs
      - name: Verify Android shared API configuration
        run: node tests/native-config.mjs
      - name: Test isolated production server routing
        run: node tests/server-routing.mjs
      - name: Test isolated multi-user booking and security
        run: node tests/server-full-flow.mjs
      - name: Test isolated WAL backup and restore safeguards
        run: node tests/sqlite-backup.mjs
      - name: Test profile and car photos in isolated SQLite
        run: node tests/photo-upload.mjs
      - name: Check no overlapping Safari API state refresh
        run: node tests/refresh-singleflight.mjs
      - name: Audit API safety, dates and real Android-origin CORS
        run: node tests/audit-api-android.mjs
      - name: Audit Safari sessions and refresh after committed writes
        run: node tests/audit-refresh-after-write.mjs
      - name: Test Safari post-mutation state freshness and latency races
        run: node tests/state-refresh-after-mutation.mjs
      - name: Validate reversible HTTPS diagnostics shell syntax
        run: bash -n deploy/temporary-https-mss-test.sh
      - name: Check anonymous and returning-session startup
        run: node tests/mobile-startup.mjs
      - name: Run real WebKit iPhone-sized browser smoke
        run: node tests/browser-webkit.mjs
      - name: Test iPhone Safari photo selection and upload
        run: node tests/browser-photo-upload.mjs
