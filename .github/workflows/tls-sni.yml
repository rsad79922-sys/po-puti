name: TLS SNI differential diagnosis
on:
  push:
    branches: ['diagnostics/tls-20261114']
    paths: ['.github/workflows/tls-sni.yml']
permissions:
  contents: read
concurrency:
  group: po-puti-tls-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read server state while probing TLS from independent network
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.POPUTI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POPUTI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POPUTI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POPUTI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.POPUTI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/tls-diagnosis.key"
          hosts_file="$RUNNER_TEMP/tls-diagnosis.hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          cat > "$RUNNER_TEMP/server-readonly.sh" <<'REMOTE'
          set -u
          probe_ip="$1"
          [[ "$probe_ip" =~ ^[0-9.]+$ ]] || exit 2
          date -u
          uptime
          free -m
          ps -C nginx -o pid,stat,pcpu,pmem,rss
          systemctl show nginx -p LimitNOFILE -p TasksCurrent
          systemctl is-active po-puti nginx
          ss -ltnp '( sport = :443 )'
          ip -d link show eth0
          sysctl net.ipv4.tcp_mtu_probing net.ipv4.tcp_base_mss
          nginx -T 2>&1 | awk '/^[[:space:]]*(listen|server_name|ssl_protocols|ssl_ciphers|ssl_ecdh_curve|ssl_conf_command|ssl_handshake_timeout|ssl_buffer_size|ssl_session_cache|ssl_session_timeout|ssl_certificate|http2)[[:space:]]/{print}'
          openssl x509 -in /etc/letsencrypt/live/vputipoputka.ru/fullchain.pem -noout -subject -issuer -dates -fingerprint -sha256
          for target in 'http://127.0.0.1:8080/api/health' 'https://vputipoputka.ru/api/health'; do
            curl --noproxy '*' -sS --resolve vputipoputka.ru:443:127.0.0.1 --connect-timeout 3 --max-time 5 -o /dev/null -w 'LOCAL http=%{http_code} tls=%{time_appconnect} total=%{time_total}\n' "$target" || true
          done
          for previous in /tmp/po-puti-tls-check.txt /tmp/po-puti-443.txt; do
            if [ -f "$previous" ]; then echo "PREVIOUS_CAPTURE $previous"; tail -n 160 "$previous" | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'; fi
          done
          capture=$(mktemp /tmp/po-puti-tls-readonly-XXXXXX)
          cap_pid=''
          cleanup(){ if [ -n "$cap_pid" ]; then kill "$cap_pid" 2>/dev/null || true; fi; rm -f "$capture"; }
          trap cleanup EXIT
          timeout 100 tcpdump -nn -tttt -l -i eth0 -s 96 "tcp port 443 and host $probe_ip" > "$capture" 2>&1 &
          cap_pid=$!
          echo CAPTURE_READY
          wait "$cap_pid" || true
          sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g' "$capture" | tail -n 2500
          ps -C nginx -o pid,stat,pcpu,pmem,rss
          ss -tin state established '( sport = :443 )' | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'
          tail -n 55 /var/log/nginx/po-puti-tls.log | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'
          awk '/probe=gh-tls-readonly/{print}' /var/log/nginx/access.log | tail -n 30 | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ipv4]/g'
          REMOTE
          ssh -i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=12 "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n bash -s -- "${SSH_CONNECTION%% *}"' < "$RUNNER_TEMP/server-readonly.sh" > "$RUNNER_TEMP/remote.txt" 2>&1 &
          remote_pid=$!
          for attempt in {1..20}; do
            if grep -q CAPTURE_READY "$RUNNER_TEMP/remote.txt"; then break; fi
            if ! kill -0 "$remote_pid" 2>/dev/null; then cat "$RUNNER_TEMP/remote.txt"; exit 1; fi
            sleep 1
          done
          grep -q CAPTURE_READY "$RUNNER_TEMP/remote.txt"
          cat > "$RUNNER_TEMP/sni-client.mjs" <<'NODE'
          import tls from 'node:tls';
          const chosen=process.argv[2];
          const started=Date.now();
          const socket=tls.connect({host:'130.49.129.99',port:443,servername:chosen==='none'?'':chosen,rejectUnauthorized:true,minVersion:'TLSv1.2',maxVersion:'TLSv1.2',checkServerIdentity:(_host,cert)=>tls.checkServerIdentity('vputipoputka.ru',cert)});
          let received='',secured=false,done=false;
          const timer=setTimeout(()=>finish('timeout'),5000);
          function finish(result){if(done)return;done=true;clearTimeout(timer);console.log('SNI '+JSON.stringify({chosen,result,secured,elapsed:Date.now()-started}));socket.destroy();process.exitCode=result==='HTTP200'?0:1;}
          socket.on('secureConnect',()=>{secured=true;socket.write('GET /api/health?probe=gh-sni-check HTTP/1.1\r\nHost: vputipoputka.ru\r\nConnection: close\r\n\r\n');});
          socket.on('data',chunk=>{received+=chunk.toString();if(received.includes('\r\n\r\n'))finish(/^HTTP\/1\.[01] 200 /.test(received)?'HTTP200':'unexpected-status');});
          socket.on('error',error=>finish(error.code||error.message));
          socket.on('end',()=>finish('EOF'));
          NODE
          for round in 1 2 3; do
            date -u
            for sni in vputipoputka.ru api.vputipoputka.ru none example.invalid; do
              node "$RUNNER_TEMP/sni-client.mjs" "$sni" || true
            done
          done
          wait "$remote_pid"
          cat "$RUNNER_TEMP/remote.txt"
